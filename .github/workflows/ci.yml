
# Tests + web build on every push/PR, then a debug APK you can download from
# the run's "Artifacts" section and install on your phone.
#
# Set these in GitHub → Settings → Secrets and variables → Actions:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (required for accounts/sync)
#   VITE_GOOGLE_CLIENT_ID                        (optional)
#
# For a signed release APK (optional, manual run only):
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build a signed release APK'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME). The
      # setup-android action re-downloaded the command-line tools and then
      # stalled on interactive licence prompts, so use the preinstalled SDK,
      # accept licences non-interactively, and install the platform the app
      # compiles against (android-36). Gradle fetches anything
      # else it needs now that the licences are accepted.
      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null
          # compileSdk 36: required by the Health Connect client library.
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - run: npm ci

      - name: Write production env from secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::VITE_SUPABASE_URL secret not set — this APK runs in local-only mode (no accounts, no cloud sync)."
          fi
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
          } > .env.production

      - name: Build production web app
        run: npx vite build --mode production

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        # On failure, surface Gradle's own error text as a job annotation so
        # it is readable from the run page (and the public API) without
        # digging through the full log.
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "What went wrong|^> |^e: |error:|Could not|Execution failed|requires|incompatible|AAR metadata|minCompileSdk|Manifest merger" "$RUNNER_TEMP/gradle.log" | grep -v "^> Task" | head -40)
            # Join lines with %0A (GitHub's newline escape) so they fit one annotation.
            summary=$(echo "$summary" | tr -d '\r' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')
            echo "::error title=Gradle build failed::$summary"
          fi
          exit $status

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: titantrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TITANTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TITANTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TITANTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TITANTRACK_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: titantrack-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
