<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TitanTrack</title>
  <meta name="description" content="Food, activity and wellbeing tracking that works the way you actually eat." />

  <!-- Installable on a phone home screen. This audience is phone-first, and a
       PWA is the difference between a bookmark and an app. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1A5C4E" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161B18" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TitanTrack" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet" />

  <!-- Google Identity Services — real Google Sign-In. Requires your own OAuth
       Client ID in .env (VITE_GOOGLE_CLIENT_ID), see .env.example. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <script>
    /* Service worker escape hatch.
     *
     * An earlier build registered the worker in development, where it served
     * same-origin assets cache-first — including /src/main.jsx. The unregister
     * logic lives in main.jsx, so the cached worker was serving the very file
     * meant to remove it and the fix could never run.
     *
     * This runs from index.html, which the worker fetches network-first, so it
     * is always the live copy. On any non-production origin it tears down every
     * registration and the app caches, then reloads once so the page is rebuilt
     * from the network. The reload is guarded by sessionStorage so it can only
     * happen a single time per tab.
     */
    (function () {
      var host = location.hostname;
      var isDev = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || host.endsWith(".local");
      if (!isDev || !("serviceWorker" in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            if (!window.caches) return null;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          })
          .then(function () {
            if (sessionStorage.getItem("tt-sw-cleared")) return;
            sessionStorage.setItem("tt-sw-cleared", "1");
            location.reload();
          })
          .catch(function () { /* nothing further we can do */ });
      }).catch(function () { /* no registrations to inspect */ });
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
